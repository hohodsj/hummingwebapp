version: '3.8'
services:
  mongo-test:
    image: mongo:6
    ports:
      - '27018:27017'

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      - DB_URL=mongodb://mongo-test:27017/hummingsang-test
    depends_on:
      - mongo-test
